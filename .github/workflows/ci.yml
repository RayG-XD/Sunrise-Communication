name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Angular 22) Build & Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sunrise-angular
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: sunrise-angular/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Application (Angular SSR & Static Prerendering)
        run: npm run build

  backend:
    name: Backend (Django) Test & Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sunrise-backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: sunrise-backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django Tests
        run: python manage.py test
