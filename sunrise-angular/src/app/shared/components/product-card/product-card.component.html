<div class="product-card-inner" data-aos="fade-up">
  <!-- Card Header & Media Area -->
  <a [routerLink]="['/products', product().category_slug, product().slug]" class="card-media-link">
    <div class="card-media-wrapper">
      @if (product().image_url) {
        <div class="product-image-box">
          <img [ngSrc]="product().image_url" [alt]="product().name" width="300" height="180" priority />
        </div>
      } @else {
        <!-- CSS Gradient Placeholder -->
        <div class="product-css-placeholder" [class]="'cat-' + product().category_slug">
          <div class="icon-circle">
            <i [class]="getCategoryIcon(product().category_slug)"></i>
          </div>
        </div>
      }
    </div>
  </a>

  <!-- Card Body Content -->
  <div class="card-body-content">
    <div class="brand-row">
      <span class="brand-badge-pill">{{ product().brand }}</span>

      @if (product().model_number) {
        <span class="model-number-badge">{{ product().model_number }}</span>
      }
    </div>

    <h3 class="product-title">
      <a [routerLink]="['/products', product().category_slug, product().slug]">
        {{ product().name }}
      </a>
    </h3>

    <!-- Action Link & Quick WhatsApp Quote -->
    <div class="card-action-bar">
      <a [routerLink]="['/products', product().category_slug, product().slug]" class="view-details-link">
        Details <i class="fa fa-angle-right"></i>
      </a>
      <a
        [href]="getWhatsappUrl()"
        (click)="onWhatsappClick($event)"
        target="_blank"
        rel="noopener noreferrer"
        class="card-whatsapp-btn"
        title="Inquire on WhatsApp"
        aria-label="Inquire on WhatsApp"
      >
        <i class="fa fa-whatsapp"></i> Quick Quote
      </a>
    </div>
  </div>
</div>
