<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="proj-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8383b"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="proj-navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2d6b"/>
      <stop offset="100%" stop-color="#0e1738"/>
    </linearGradient>
    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8383b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e8383b" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- Ceiling Mount Pole -->
  <rect x="28" y="4" width="8" height="16" fill="#64748b"/>
  <rect x="22" y="4" width="20" height="4" fill="#334155"/>
  <!-- Main Projector Body -->
  <rect x="6" y="20" width="52" height="24" rx="5" fill="url(#proj-navy)" stroke="#0e1738" stroke-width="2"/>
  <!-- Ventilation Grille -->
  <line x1="12" y1="26" x2="12" y2="38" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="26" x2="16" y2="38" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="26" x2="20" y2="38" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <!-- Optical Lens Housing Ring -->
  <circle cx="42" cy="32" r="9" fill="url(#proj-red)"/>
  <circle cx="42" cy="32" r="6" fill="#0f172a"/>
  <circle cx="42" cy="32" r="3" fill="#ffffff"/>
  <!-- Power & Control Buttons -->
  <circle cx="28" cy="26" r="2" fill="#e8383b"/>
  <circle cx="33" cy="26" r="1.5" fill="#ffffff"/>
  <!-- Projector Foot Stands -->
  <rect x="12" y="44" width="6" height="4" rx="1" fill="#334155"/>
  <rect x="46" y="44" width="6" height="4" rx="1" fill="#334155"/>
  <!-- Projected Light Ray Cone Beam -->
  <polygon points="51,26 64,18 64,46 51,38" fill="url(#beam-grad)"/>
</svg>
