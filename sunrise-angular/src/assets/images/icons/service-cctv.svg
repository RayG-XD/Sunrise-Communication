<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cctv-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8383b"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="navy-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2d6b"/>
      <stop offset="100%" stop-color="#0e1738"/>
    </linearGradient>
  </defs>
  <!-- Wall Mount Bracket -->
  <path d="M 8 16 L 8 40 L 14 40 L 14 30 L 24 30" fill="none" stroke="url(#navy-grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="4" y="12" width="6" height="32" rx="2" fill="url(#navy-grad)"/>
  <!-- Joint Connector -->
  <circle cx="24" cy="30" r="5" fill="#64748b"/>
  <!-- Camera Body -->
  <path d="M 24 22 L 48 16 L 56 22 L 56 38 L 48 44 L 24 38 Z" fill="url(#navy-grad)"/>
  <!-- Sun Shield / Hood -->
  <path d="M 22 18 L 52 12 L 54 18 L 24 24 Z" fill="url(#cctv-grad)"/>
  <!-- Front Camera Lens Ring -->
  <ellipse cx="54" cy="30" rx="4" ry="10" fill="#64748b"/>
  <ellipse cx="54" cy="30" rx="2.5" ry="6" fill="#1c2d6b"/>
  <!-- Glass Lens Core -->
  <circle cx="54" cy="30" r="2" fill="url(#cctv-grad)"/>
  <!-- Infrared LED Sensors -->
  <circle cx="48" cy="24" r="1.5" fill="#e8383b"/>
  <circle cx="48" cy="36" r="1.5" fill="#e8383b"/>
  <!-- Recording Status LED Light Beam -->
  <path d="M 58 26 L 64 22 M 58 30 L 64 30 M 58 34 L 64 38" stroke="#e8383b" stroke-width="2" stroke-linecap="round"/>
</svg>
