<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tel-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8383b"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="tel-navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2d6b"/>
      <stop offset="100%" stop-color="#0e1738"/>
    </linearGradient>
  </defs>
  <!-- Phone Body Stand -->
  <path d="M 10 20 L 54 20 L 58 54 L 6 54 Z" fill="url(#tel-navy)"/>
  <!-- LCD Display Screen -->
  <polygon points="16,24 48,24 46,36 18,36" fill="#0f172a" stroke="#e8383b" stroke-width="1.5"/>
  <line x1="22" y1="28" x2="42" y2="28" stroke="#e8383b" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="32" x2="34" y2="32" stroke="#e8383b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Dialpad Key Buttons -->
  <rect x="22" y="40" width="6" height="4" rx="1" fill="#ffffff"/>
  <rect x="30" y="40" width="6" height="4" rx="1" fill="#ffffff"/>
  <rect x="38" y="40" width="6" height="4" rx="1" fill="#ffffff"/>
  <rect x="22" y="46" width="6" height="4" rx="1" fill="#ffffff"/>
  <rect x="30" y="46" width="6" height="4" rx="1" fill="#ffffff"/>
  <rect x="38" y="46" width="6" height="4" rx="1" fill="url(#tel-red)"/>
  <!-- Phone Handset -->
  <path d="M 8 14 C 8 10, 14 10, 14 14 L 14 48 C 14 52, 8 52, 8 48 Z" fill="url(#tel-red)"/>
  <circle cx="11" cy="16" r="2.5" fill="#ffffff"/>
  <circle cx="11" cy="46" r="2.5" fill="#ffffff"/>
  <!-- Signal Transmission Waves -->
  <path d="M 52 14 A 8 8 0 0 1 58 20" fill="none" stroke="#e8383b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 56 8 A 14 14 0 0 1 64 16" fill="none" stroke="#e8383b" stroke-width="2.5" stroke-linecap="round"/>
</svg>
