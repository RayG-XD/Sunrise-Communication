<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bio-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8383b"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="bio-navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2d6b"/>
      <stop offset="100%" stop-color="#0e1738"/>
    </linearGradient>
  </defs>

  <!-- Biometric Scanner Terminal Casing -->
  <rect x="6" y="8" width="34" height="48" rx="7" fill="url(#bio-navy)" stroke="#0e1738" stroke-width="2"/>
  
  <!-- LED Status Indicator -->
  <circle cx="15" cy="14" r="2" fill="#22c55e"/>
  <circle cx="23" cy="14" r="2" fill="#e8383b"/>

  <!-- Glass Touch Window -->
  <rect x="11" y="20" width="24" height="30" rx="5" fill="#0f172a" stroke="#e8383b" stroke-width="1.5"/>

  <!-- Concentric Fingerprint Ridge Loops -->
  <path d="M 23 33 A 2 2 0 0 1 25 35 C 25 38, 23 40, 23 43" fill="none" stroke="#e8383b" stroke-width="2" stroke-linecap="round"/>
  <path d="M 20 31 C 20 28, 26 28, 27 32 C 28 35, 26 39, 25 44" fill="none" stroke="#e8383b" stroke-width="2" stroke-linecap="round"/>
  <path d="M 17 34 C 17 28, 25 24, 30 29 C 31 33, 29 41, 27 45" fill="none" stroke="#e8383b" stroke-width="2" stroke-linecap="round"/>
  <path d="M 20 42 C 20 39, 21 37, 23 36" fill="none" stroke="#e8383b" stroke-width="2" stroke-linecap="round"/>

  <!-- Laser Scan Beam Line -->
  <line x1="9" y1="35" x2="37" y2="35" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

  <!-- RFID Contactless Access Card (Hovering) -->
  <rect x="36" y="16" width="22" height="30" rx="3" fill="url(#bio-red)" stroke="#b91c1c" stroke-width="1.5" transform="rotate(12 47 31)"/>
  <!-- RFID Smart Chip -->
  <rect x="40" y="22" width="6" height="5" rx="1" fill="#f59e0b" transform="rotate(12 43 24.5)"/>
  <!-- Card Wireless Signal Waves -->
  <path d="M 46 12 A 6 6 0 0 1 52 18" fill="none" stroke="#e8383b" stroke-width="2" stroke-linecap="round"/>
  <path d="M 50 8 A 10 10 0 0 1 58 16" fill="none" stroke="#e8383b" stroke-width="2" stroke-linecap="round"/>

  <!-- Security Shield Verification Badge at Bottom Right -->
  <path d="M 44 40 L 52 40 L 52 46 C 52 50, 48 53, 48 53 C 48 53, 44 50, 44 46 Z" fill="url(#bio-navy)" stroke="#e8383b" stroke-width="1.5"/>
  <!-- Checkmark inside Shield -->
  <path d="M 46 46 L 48 48 L 51 44" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
